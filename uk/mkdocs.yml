plugins:
  - search
  - autorefs
markdown_extensions:
  - admonition
  - pymdownx.details
  - attr_list
  - md_in_html
  - attr_list
  - pymdownx.caret
  - pymdownx.mark
  - pymdownx.tilde
  - tables
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - toc:
        permalink: ➧
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

site_name: WildcoreDMS wiki
repo_url: https://github.com/wildcore-dms/wiki
theme:
  language: uk
  name: material
  features:
    - navigation.footer
    - content.code.copy
  logo: assets/wildcore_logo.png

extra:
  alternate:
    - name: English
      link: /en/
      lang: en
    - name: Українська
      link: /uk/
      lang: uk
